<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiếp Nhận Ý Kiến Đóng Góp Kỳ Thi Thăng Cấp Đai</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-3 flex items-center justify-center">
  
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-5 sm:p-7 border border-slate-100">
    
    <!-- Header & Logo Section -->
    <div class="text-center mb-5">
      <div class="flex justify-center mb-2.5">
        <img 
          src="logo.png" 
          alt="Logo Trung tâm Taekwondo Kids Việt Nam" 
          class="h-12 sm:h-14 w-auto object-contain"
          loading="eager"
        >
      </div>
      
      <!-- Tiêu đề Thương hiệu hiển thị chính xác 1 dòng trên mọi màn hình -->
      <h1 class="font-bold text-red-600 uppercase whitespace-nowrap text-[clamp(11px,3.6vw,18px)] tracking-tight">
        TRUNG TÂM TAEKWONDO KIDS VIỆT NAM
      </h1>
      
      <p class="text-xs sm:text-sm font-semibold text-slate-700 mt-1">
        TIẾP NHẬN Ý KIẾN ĐÓNG GÓP<br>KỲ THI THĂNG CẤP ĐAI LẦN THỨ II - NĂM 2026
      </p>
    </div>

    <!-- Form Section -->
    <form id="feedbackForm" class="space-y-3.5">
      <div>
        <label for="voSinh" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Họ và tên võ sinh <span class="text-red-500">*</span></label>
        <input type="text" id="voSinh" required placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:outline-none transition-all">
      </div>

      <div>
        <label for="phuHuynh" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Họ và tên phụ huynh <span class="text-red-500">*</span></label>
        <input type="text" id="phuHuynh" required placeholder="Ví dụ: Nguyễn Văn B" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:outline-none transition-all">
      </div>

      <div>
        <label for="lienHe" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Số điện thoại hoặc Email <span class="text-red-500">*</span></label>
        <input type="text" id="lienHe" required placeholder="0912345678 hoặc email@gmail.com" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:outline-none transition-all">
      </div>

      <div>
        <label for="coSo" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Cơ sở theo học <span class="text-red-500">*</span></label>
        <select id="coSo" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:outline-none bg-white transition-all">
          <option value="">-- Chọn cơ sở --</option>
          <option value="Hapulico">Hapulico</option>
          <option value="Nghĩa Đô">Nghĩa Đô</option>
          <option value="Green Stars">Green Stars</option>
          <option value="Hà Đông">Hà Đông</option>
          <option value="Long Biên">Long Biên</option>
        </select>
      </div>

      <div>
        <label for="yKien" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Đóng góp ý kiến <span class="text-red-500">*</span></label>
        <textarea id="yKien" rows="3.5" required placeholder="Qúy phụ huynh vui lòng đóng góp ý kiến về Kỳ thi tại đây..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 focus:outline-none transition-all"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-sm">
        Gửi ý kiến
      </button>
    </form>
    
    <!-- Status Message -->
    <div id="statusMessage" class="hidden mt-3.5 p-3 text-center rounded-lg text-xs sm:text-sm font-medium transition-all"></div>
  </div>

  <script>
    // Điền Web App URL sau khi deploy Google Apps Script vào đây
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyb3EppCyq4Fi7p_ye5g7Hc-w5JXJvUPSRD5xnFfyXUw88sMb6GLDrNYhu-Z7eWcZf_/exec';
    
    const form = document.getElementById('feedbackForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
      btnSubmit.innerText = 'Đang gửi ý kiến...';

      const payload = {
        voSinh: document.getElementById('voSinh').value,
        phuHuynh: document.getElementById('phuHuynh').value,
        lienHe: document.getElementById('lienHe').value,
        coSo: document.getElementById('coSo').value,
        yKien: document.getElementById('yKien').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMessage.className = 'mt-3.5 p-3 text-center rounded-lg text-xs sm:text-sm font-medium bg-green-50 text-green-700 border border-green-200';
        statusMessage.innerText = 'Cảm ơn phụ huynh đã gửi đóng góp ý kiến! Trung tâm sẽ ghi nhận và phản hồi sớm nhất.';
        statusMessage.classList.remove('hidden');
        form.reset();
      })
      .catch(error => {
        statusMessage.className = 'mt-3.5 p-3 text-center rounded-lg text-xs sm:text-sm font-medium bg-red-50 text-red-700 border border-red-200';
        statusMessage.innerText = 'Xảy ra lỗi trong quá trình gửi. Vui lòng kiểm tra kết nối mạng và thử lại.';
        statusMessage.classList.remove('hidden');
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
        btnSubmit.innerText = 'Gửi ý kiến';
      });
    });
  </script>
</body>
</html>
